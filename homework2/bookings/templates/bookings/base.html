<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Movie Theater{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #e6edf3; }
        .navbar { background-color: #161b22 !important; border-bottom: 1px solid #30363d; }
        .card { background-color: #161b22; border: 1px solid #30363d; color: #e6edf3; }
        .btn-primary { background-color: #e50914; border-color: #e50914; }
        .btn-primary:hover { background-color: #b20710; border-color: #b20710; }
        .seat-btn { width: 50px; height: 50px; margin: 4px; font-size: 0.75rem; }
        .seat-available { background-color: #238636; border-color: #238636; color: white; }
        .seat-booked { background-color: #6e7681; border-color: #6e7681; color: white; cursor: not-allowed; }
        .hero { background: linear-gradient(135deg, #e50914, #0d1117); padding: 60px 0; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="/"><i class="bi bi-camera-reels-fill text-danger"></i> CineBook</a>
        <div class="ms-auto d-flex gap-2">
            {% if user.is_authenticated %}
                <span class="navbar-text me-2">👋 {{ user.username }}</span>
                <a href="/history/" class="btn btn-outline-light btn-sm">My Bookings</a>
                <a href="/logout/" class="btn btn-outline-danger btn-sm">Logout</a>
            {% else %}
                <a href="/login/" class="btn btn-outline-light btn-sm">Login</a>
                <a href="/register/" class="btn btn-danger btn-sm">Register</a>
            {% endif %}
        </div>
    </div>
</nav>
<div class="container mt-4">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
